version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bgp-postgres
    environment:
      POSTGRES_USER: bgp
      POSTGRES_PASSWORD: bgp_dev_secret
      POSTGRES_DB: bank_game_platform
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bgp -d bank_game_platform']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bgp-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: bgp-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://bgp:bgp_dev_secret@postgres:5432/bank_game_platform
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: local_dev_access_secret_min_32_chars_ok
      JWT_REFRESH_SECRET: local_dev_refresh_secret_min_32_chars_ok
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - '4000:4000'
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - /app/node_modules
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: bgp-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://bgp:bgp_dev_secret@postgres:5432/bank_game_platform
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: local_dev_access_secret_min_32_chars_ok
      JWT_REFRESH_SECRET: local_dev_refresh_secret_min_32_chars_ok
    volumes:
      - ./backend/src:/app/src
      - /app/node_modules
    command: npx tsx src/worker.ts
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: bgp-adminer
    ports:
      - '8080:8080'
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
