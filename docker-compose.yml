version: '3.9'

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: bgp-postgres
    environment:
      POSTGRES_USER: bgp
      POSTGRES_PASSWORD: bgp_dev_secret
      POSTGRES_DB: bank_game_platform
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-rls.sql:/docker-entrypoint-initdb.d/01-rls.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bgp']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bgp-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: bgp-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://bgp:bgp_dev_secret@postgres:5432/bank_game_platform
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev_access_secret_change_in_prod_minimum_32_chars
      JWT_REFRESH_SECRET: dev_refresh_secret_change_in_prod_minimum_32_chars
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
    ports:
      - '4000:4000'
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    command: sh -c "npx prisma migrate dev --name init && npx tsx prisma/seed.ts && npm run dev"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: bgp-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://bgp:bgp_dev_secret@postgres:5432/bank_game_platform
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev_access_secret_change_in_prod_minimum_32_chars
      JWT_REFRESH_SECRET: dev_refresh_secret_change_in_prod_minimum_32_chars
    volumes:
      - ./backend/src:/app/src
    command: npx tsx src/worker.ts

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: bgp-frontend
    environment:
      VITE_API_URL: http://localhost:4000/api/v1
    ports:
      - '3000:3000'
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api

  adminer:
    image: adminer
    container_name: bgp-adminer
    ports:
      - '8080:8080'
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
